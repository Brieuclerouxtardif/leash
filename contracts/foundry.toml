[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib", "../node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
]
fs_permissions = [{ access = "read", path = "../secrets" }, { access = "read-write", path = "../evidence" }]

[fuzz]
runs = 2000

[invariant]
runs = 256
depth = 64
fail_on_revert = false
